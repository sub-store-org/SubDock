name: Desktop build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            rpm \
            patchelf \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev
      - name: Prepare latest stable runtime resources
        run: |
          tool/prepare_backend.sh
          tool/prepare_frontend.sh
          tool/prepare_runtime.sh linux-x64
          tool/prepare_http_meta.sh linux-x64
      - name: Package DEB, RPM, and AppImage
        run: |
          dart pub global activate fastforge 0.6.12
          fastforge package \
            --platform linux \
            --targets deb,rpm,appimage \
            --hook-pre 'tool/verify_bundle.sh "$BUILD_OUTPUT_DIRECTORY"'
      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: dist/**
          if-no-files-found: error
      - name: Archive Linux bundle
        run: |
          tar --create --file build/linux/x64/release/linux-bundle.tar \
            --directory build/linux/x64/release bundle
      - uses: actions/upload-artifact@v7
        with:
          name: linux-bundle
          path: build/linux/x64/release/linux-bundle.tar
          if-no-files-found: error

  arch:
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - name: Install Arch packaging tools
        run: |
          pacman -Syu --noconfirm \
            gtk3 \
            webkit2gtk-4.1 \
            libayatana-appindicator
      - uses: actions/download-artifact@v8
        with:
          name: linux-bundle
          path: build/linux/x64/release
      - name: Extract Linux bundle
        run: |
          tar --extract \
            --file build/linux/x64/release/linux-bundle.tar \
            --directory build/linux/x64/release
      - name: Create unprivileged package builder
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build standard Arch package
        run: su --login builder --shell /bin/sh --command "$GITHUB_WORKSPACE/tool/package_arch.sh"
      - uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Prepare latest stable runtime resources
        shell: bash
        run: |
          tool/prepare_backend.sh
          tool/prepare_frontend.sh
          tool/prepare_runtime.sh windows-x64
          tool/prepare_http_meta.sh windows-x64
      - name: Package EXE
        shell: bash
        run: |
          choco install innosetup --no-progress --yes
          dart pub global activate fastforge 0.6.12
          dart pub global run fastforge:main package \
            --platform windows \
            --targets exe \
            --hook-pre 'tool/verify_bundle.sh "$BUILD_OUTPUT_DIRECTORY" windows'
      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: dist/**
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Prepare latest stable runtime resources
        run: |
          tool/prepare_backend.sh
          tool/prepare_frontend.sh
          tool/prepare_runtime.sh "darwin-arm64"
          tool/prepare_http_meta.sh "darwin-arm64"
      - name: Package DMG
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
          TARGET_ARCH: arm64
        run: |
          npm install --global appdmg
          dart pub global activate fastforge 0.6.12
          fastforge package \
            --platform macos \
            --targets dmg \
            --hook-pre '
              tool/verify_bundle.sh "$BUILD_OUTPUT_DIRECTORY/SubDock.app/Contents/MacOS" &&
              tool/thin_macos_bundle.sh "$BUILD_OUTPUT_DIRECTORY/SubDock.app" "$TARGET_ARCH"
            '
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/**
          if-no-files-found: error
