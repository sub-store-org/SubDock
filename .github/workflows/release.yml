name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      stable_version: ${{ steps.release.outputs.stable_version }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          stable_version="$(sed -n 's/^version: *\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n 1)"

          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_version="${tag#v}"
          test -n "$stable_version"
          test "$tag_version" = "$stable_version"
          echo "stable_version=$stable_version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-release
    uses: ./.github/workflows/desktop-build.yml
    permissions:
      contents: read

  release:
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: arch-package
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: windows-exe
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: macos-dmg
          path: dist
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          assets=()
          while IFS= read -r -d '' file; do
            assets+=("$file")
          done < <(find dist -type f \( \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.AppImage' -o \
            -name '*.pkg.tar.zst' -o \
            -name '*.exe' -o \
            -name '*.dmg' \
          \) -print0)
          for pattern in '*.deb' '*.rpm' '*.AppImage' '*.pkg.tar.zst' '*.exe' '*.dmg'; do
            test -n "$(find dist -type f -name "$pattern" -print -quit)"
          done
          test "${#assets[@]}" -gt 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=()
          while IFS= read -r -d '' file; do
            assets+=("$file")
          done < <(find dist -type f \( \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.pkg.tar.zst' -o \
            -name '*.exe' -o \
            -name '*.dmg' \
          \) -print0)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes --verify-tag
