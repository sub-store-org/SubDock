name: Canary

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

permissions:
  contents: read

jobs:
  test:
    if: "!contains(github.event.head_commit.message, '[release]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Install Linux native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    if: contains(github.event.head_commit.message, '[build]')
    uses: ./.github/workflows/desktop-build.yml
    permissions:
      contents: read
